name: Formular veröffentlichen (GitHub Pages)

# Das öffentliche Anmeldeformular (#474) liegt für alle Gemeinden an EINER Adresse:
# https://falwin.github.io/churchtools-gemeinde-apps/ (Bauplan §2, „ohne Server").
#
# Vorerst NUR von Hand (Actions → „Formular veröffentlichen" → Run workflow): GitHub Pages muss dafür in
# den Repo-Einstellungen eingeschaltet sein (Settings → Pages → Source: GitHub Actions) – das macht Alwin,
# sobald das Formular etwas kann (A4). Danach kommt der Auslöser `anmeldung-v*` dazu.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w formular
      - uses: actions/upload-pages-artifact@v3
        with:
          path: formular/dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
