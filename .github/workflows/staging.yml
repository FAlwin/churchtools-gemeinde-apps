name: Staging-Image

# Das Test-Image `:staging` (musik-test.ecg-donrath.de, der NAS zieht es per Watchtower).
#
# **Seit 23.10.2026 baut Staging NUR auf Zuruf – auch `main`** (Alwin). Bis 22.10. baute jeder Push auf main,
# feat/**, fix/**; dann nur noch main von selbst („da haben sich wieder andere vorgedrängelt“). Auch das reichte
# nicht: Am 23.10. überschrieben main-Merges anderer Sitzungen zweimal an einem Nachmittag den Zweig, den Alwin
# gerade am iPad prüfte. Es gibt nur EINE Test-Instanz – wer etwas zeigen will, legt es ausdrücklich drauf:
#
#   gh workflow run staging.yml --ref feat/mein-zweig     (oder --ref main, z. B. vor einem Release)
#
# Die Version nennt den Zweig (`staging-feat-mein-zweig-<sha>`, im „Mehr“-Tab), damit man sieht, was läuft.
# Der Server erkennt Staging am Präfix `staging-` (`server/src/config.ts`) – das bleibt.
# Nur amd64 (Test-NAS ist x86_64) → schnell, ein einziger nativer Build.
on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/falwin/churchtools-musik-app

jobs:
  build:
    runs-on: ubuntu-latest
    # Üblich 1–2 Minuten (ohne Docker-Cache länger). Grenze gegen hängende Läufe – ohne sie hing am 11.11.2026 ein Job 6 h (siehe e2e in ci.yml).
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kurzer Commit-Hash für die Versionsanzeige im „Mehr"-Tab → man erkennt sofort, ob die
      # Test-Instanz den neuesten Stand zieht (z. B. „staging-f06db3c").
      - name: Kurzer Commit-Hash und Zweig
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # Zweig für die Versionsanzeige: Schrägstriche zu Bindestrichen, nur sichere Zeichen.
          echo "ZWEIG=$(echo "$GITHUB_REF_NAME" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')" >> "$GITHUB_ENV"

      - name: Build & Push :staging
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            APP_VERSION=staging-${{ env.ZWEIG }}-${{ env.SHORT_SHA }}
          push: true
          tags: ${{ env.IMAGE }}:staging
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging
