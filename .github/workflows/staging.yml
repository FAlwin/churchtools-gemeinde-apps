name: Staging-Image

# Das Test-Image `:staging` (musik-test.ecg-donrath.de, der NAS zieht es per Watchtower).
#
# **Seit 22.10.2026 baut nur `main` von selbst; Zweige kommen auf Zuruf** (Alwin: „da haben sich wieder andere
# vorgedrängelt“). Vorher baute jeder Push auf main, feat/**, fix/** – mit mehreren Sitzungen gleichzeitig
# überschrieb jeder die eine Test-Instanz, und der Stand, den Alwin prüfen sollte, war oft schon weg. Wer einen
# Zweig zeigen will, legt ihn ausdrücklich drauf:
#
#   gh workflow run staging.yml --ref feat/mein-zweig
#
# Die Version nennt den Zweig (`staging-feat-mein-zweig-<sha>`, im „Mehr“-Tab), damit man sieht, was läuft.
# Der Server erkennt Staging am Präfix `staging-` (`server/src/config.ts`) – das bleibt.
# Nur amd64 (Test-NAS ist x86_64) → schnell, ein einziger nativer Build.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ghcr.io/falwin/churchtools-musik-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kurzer Commit-Hash für die Versionsanzeige im „Mehr"-Tab → man erkennt sofort, ob die
      # Test-Instanz den neuesten Stand zieht (z. B. „staging-f06db3c").
      - name: Kurzer Commit-Hash und Zweig
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # Zweig für die Versionsanzeige: Schrägstriche zu Bindestrichen, nur sichere Zeichen.
          echo "ZWEIG=$(echo "$GITHUB_REF_NAME" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')" >> "$GITHUB_ENV"

      - name: Build & Push :staging
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            APP_VERSION=staging-${{ env.ZWEIG }}-${{ env.SHORT_SHA }}
          push: true
          tags: ${{ env.IMAGE }}:staging
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging
