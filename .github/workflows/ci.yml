name: CI

# Läuft bei jedem Push auf main und bei jedem Pull Request.
# Kein DB-Service nötig: ChurchTools ist die Datenquelle, die App hat keine eigene DB.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Formatierung zuerst: billigster Schritt, und ein Format-Diff macht jede spätere
      # Fehlermeldung schwerer lesbar. ESLint prüft Formatierung NICHT (eslint-config-prettier
      # schaltet die Regeln ab) – ohne diesen Schritt driftet der Stil unbemerkt weiter.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint
      - name: Verwaiste Doc-Kommentare
        run: npm run doc-check

      # Einträge für den nächsten Release (changelog.d/, seit 22.10.2026) – Format prüfen, sonst fällt es erst beim Release auf.
      - name: CHANGELOG-Einträge
        run: npm run changelog -- --pruefen

      - name: Build
        run: npm run build

      # Die zweite Auslieferung (#337): die App als ChurchTools-Erweiterung (ZIP). Mitgebaut, damit ein
      # PR, der nur die PWA im Blick hat, den Extension-Build nicht unbemerkt bricht.
      - name: Build ChurchTools-Erweiterung
        run: npm run build:extension -w client

      # Die Anmeldungen (#474) sind nur Erweiterung: gebaut hat sie schon `npm run build`, hier wird gepackt –
      # dabei prüft das Packen, dass keine Stilregel ChurchTools trifft.
      - name: Anmeldungen-Erweiterung packen
        run: npm run paket -w anmeldungen

      # Der Dienstplaner ist (vorerst) ebenfalls nur Erweiterung – gleiche Prüfung beim Packen.
      - name: Dienstplaner-Erweiterung packen
        run: npm run paket -w dienstplaner

      # Das Organigramm (Bauplan O1) ist ebenfalls nur Erweiterung – gleiche Prüfung beim Packen.
      - name: Organigramm-Erweiterung packen
        run: npm run paket -w organigramm

      # Die Protokolle (Bauplan Protokolle) sind ebenfalls nur Erweiterung – gleiche Prüfung beim Packen.
      - name: Protokolle-Erweiterung packen
        run: npm run paket -w protokolle

      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      # Zwei Ebenen: Render-Smoke (?demo=chart, ohne Backend) UND der volle Auth-Flow gegen den
      # ChurchTools-Stub (#174) – Playwright startet Stub, Server und Client selbst.
      - name: E2E (Render-Smoke + Auth-Flow gegen CT-Stub)
        run: npm run test:e2e
