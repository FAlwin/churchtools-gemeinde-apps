name: Release

# Bei jedem Versions-Tag (z. B. v2.0.0) ein Multi-Arch-Image bauen und nach GHCR pushen.
# Jede Architektur baut auf einem NATIVEN Runner (kein QEMU) – amd64 auf ubuntu-latest,
# arm64 auf ubuntu-24.04-arm. Beide Teile werden danach zu einem Manifest zusammengeführt.
# Ablauf: erst in main mergen (CI grün) -> dann `git tag vX.Y.Z && git push origin vX.Y.Z`.
on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: ghcr.io/falwin/churchtools-musik-app

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Plattform-Kennung
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (nach Digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Digest exportieren
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Digest als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Digests einsammeln
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Tags ermitteln
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Manifest erstellen & pushen
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Ergebnis prüfen
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

      # Die ChurchTools-Erweiterung als ZIP (#337) – hängt am Release, damit eine Gemeinde ohne eigenen
      # Server sie dort herunterladen kann. Das Kürzel ist fest `musik-app` (der Pfad /ccm/<Kürzel>/
      # steckt im Build) – die Anleitung (docs/betrieb/ERWEITERUNG.md) nennt genau dieses Kürzel.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: ChurchTools-Erweiterung bauen
        run: |
          npm ci
          npm run build:extension -w client
        env:
          VITE_KEY: musik-app
          VITE_APP_VERSION: ${{ github.ref_name }}

      # GitHub Release zum Tag anlegen/aktualisieren – Datenquelle für den In-App-Update-Hinweis
      # (Endpoint /api/update-check liest das neueste Release). Notes werden automatisch erzeugt.
      - name: GitHub Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Fester Text ÜBER den automatischen Änderungsnotizen: Wer von der Release-Seite kommt, sieht
          # sonst nur die ZIP und nicht, was ins ChurchTools-Formular gehört (Alwin, 07.10.2026).
          body: |
            ### ChurchTools-Erweiterung (ohne eigenen Server)

            `musik-app-${{ github.ref_name }}.zip` unten unter **Assets** herunterladen und in ChurchTools unter
            **Administration → Erweiterungen → Erweiterung hinzufügen** hochladen. **Kürzel: `musik-app`**
            (genau so – sonst lädt sie nicht), Name frei. Zum Aktualisieren beim Eintrag auf den Stift und die
            neue ZIP hochladen, sonst nichts löschen.
            Anleitung: https://github.com/FAlwin/churchtools-gemeinde-apps/blob/main/docs/betrieb/ERWEITERUNG.md
            **Welche ChurchTools-Rechte eure Musiker und Admins brauchen:** [Rechte einrichten](https://github.com/FAlwin/churchtools-gemeinde-apps/blob/main/docs/betrieb/ERWEITERUNG.md#rechte-einrichten)

            **Mit eigenem Server (Docker):** Update wie gewohnt, siehe [UPDATE.md](https://github.com/FAlwin/churchtools-gemeinde-apps/blob/main/UPDATE.md).
          files: client/releases/musik-app-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
          # Tags mit Suffix (z. B. v2.2.0-rc1) als Vorabversion markieren, damit
          # /releases/latest sie NICHT als stabiles Update an die Gemeinden ausspielt.
          prerelease: ${{ contains(github.ref_name, '-') }}
