name: Release Protokolle

# Die Protokolle haben ihren eigenen Release-Weg – getrennt von der Musik-App (Bauplan Protokolle S1):
# Tag `protokolle-vX.Y.Z` → Erweiterung bauen und packen → GitHub Release mit der ZIP (`make_latest: false`,
# siehe Vorlage). Der Tag-Filter `v*` der Musik-App greift hier nicht: `protokolle-v…` beginnt nicht mit `v`.
#
# Ablauf: erst in main mergen (CI grün) → `git tag protokolle-vX.Y.Z && git push origin protokolle-vX.Y.Z`.
on:
  push:
    tags:
      - 'protokolle-v*'

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/erweiterung-release.yml
    with:
      praefix: protokolle-
      workspace: protokolle
      kuerzel: protokolle
      titel: Protokolle
      anleitung: docs/betrieb/PROTOKOLLE.md
