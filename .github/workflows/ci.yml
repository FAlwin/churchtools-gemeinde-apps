name: CI

# Läuft bei jedem Push auf main und bei jedem Pull Request.
# Kein DB-Service nötig: ChurchTools ist die Datenquelle, die App hat keine eigene DB.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Bekannte Lücken in Laufzeit-Abhängigkeiten (#849): ab „hoch“ rot – dann wird gehandelt, bevor gemergt wird.
      # Nur Laufzeit (`--omit=dev`), weil seit dem zweistufigen Image nur sie ausgeliefert werden.
      - name: npm audit (Laufzeit)
        run: npm audit --omit=dev --audit-level=high

      # Formatierung zuerst: billigster Schritt, und ein Format-Diff macht jede spätere
      # Fehlermeldung schwerer lesbar. ESLint prüft Formatierung NICHT (eslint-config-prettier
      # schaltet die Regeln ab) – ohne diesen Schritt driftet der Stil unbemerkt weiter.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint
      - name: Verwaiste Doc-Kommentare
        run: npm run doc-check

      # Einträge für den nächsten Release (changelog.d/, seit 22.10.2026) – Format prüfen, sonst fällt es erst beim Release auf.
      - name: CHANGELOG-Einträge
        run: npm run changelog -- --pruefen

      # Die manuellen Testfälle (docs/tests/testfaelle, #234): Priorität gültig, jedes „Betrifft“ gibt es noch. Fehlte hier
      # bis zum 30.10.2026 – TF-EDIT-14 mit Priorität „mittel“ kam so unbemerkt auf main (lokal rot, CI grün).
      - name: Testfälle
        run: npm run testplan -- --pruefen

      - name: Build
        run: npm run build

      # Die zweite Auslieferung (#337): die App als ChurchTools-Erweiterung (ZIP). Mitgebaut, damit ein
      # PR, der nur die PWA im Blick hat, den Extension-Build nicht unbemerkt bricht.
      - name: Build ChurchTools-Erweiterung
        run: npm run build:extension -w client

      # Die Anmeldungen (#474) sind nur Erweiterung: gebaut hat sie schon `npm run build`, hier wird gepackt –
      # dabei prüft das Packen, dass keine Stilregel ChurchTools trifft.
      - name: Anmeldungen-Erweiterung packen
        run: npm run paket -w anmeldungen

      # Der Dienstplaner ist (vorerst) ebenfalls nur Erweiterung – gleiche Prüfung beim Packen.
      - name: Dienstplaner-Erweiterung packen
        run: npm run paket -w dienstplaner

      # Das Organigramm (Bauplan O1) ist ebenfalls nur Erweiterung – gleiche Prüfung beim Packen.
      - name: Organigramm-Erweiterung packen
        run: npm run paket -w organigramm

      # Die Protokolle (Bauplan Protokolle) sind ebenfalls nur Erweiterung – gleiche Prüfung beim Packen.
      - name: Protokolle-Erweiterung packen
        run: npm run paket -w protokolle

      # Der Gebetsabend (Bauplan Gebetsabend G1) ist ebenfalls nur Erweiterung – gleiche Prüfung beim Packen.
      - name: Gebetsabend-Erweiterung packen
        run: npm run paket -w gebetsabend

      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Ein grüner Lauf braucht 3–4 Minuten. Ohne Grenze hing die Browser-Installation am 11.11.2026 sechs Stunden lang
    # (Ubuntu-Paketserver nicht erreichbar), bis GitHub den Job abbrach – mit Grenze scheitert er schnell und kann neu laufen.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      # Zwei Ebenen: Render-Smoke (?demo=chart, ohne Backend) UND der volle Auth-Flow gegen den
      # ChurchTools-Stub (#174) – Playwright startet Stub, Server und Client selbst.
      - name: E2E (Render-Smoke + Auth-Flow gegen CT-Stub)
        run: npm run test:e2e

  # Das ausgelieferte Image wirklich bauen und starten (#849): Seit es zweistufig ist, fehlen im Laufzeit-Teil die
  # Entwickler-Pakete – fehlt dort etwas, das der Server braucht, merkt das sonst erst Staging (oder Watchtower in Prod).
  docker-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image bauen
        run: docker build -t musik-app-probe .

      - name: Starten und prüfen
        run: |
          docker run -d --name probe -p 3001:3001 \
            -e NODE_ENV=production \
            -e CHURCHTOOLS_BASE_URL=https://example.church.tools \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e ABLAGE_UMZUG=aus \
            musik-app-probe
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3001/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:3001/api/health | grep -q '"status":"ok"'
          # Die Web-App kommt aus Stufe 1 mit.
          curl -fsS http://127.0.0.1:3001/ | grep -q '<div id="root"'
          # Läuft als „node“, nicht als root.
          test "$(docker exec probe stat -c %U /proc/1)" = "node"
          # Keine Entwickler-Werkzeuge im Laufzeit-Image, aber tsx (der Server läuft damit).
          docker exec probe test ! -e /app/node_modules/vite
          docker exec probe test ! -e /app/node_modules/vitest
          docker exec probe test ! -e /app/node_modules/eslint
          docker exec probe test -e /app/node_modules/tsx

      - name: Protokoll bei Fehler
        if: failure()
        run: docker logs probe || true
