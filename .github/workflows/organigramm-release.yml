name: Release Organigramm

# Das Organigramm hat seinen eigenen Release-Weg – getrennt von Musik-App und Dienstplaner (Bauplan O1):
# Tag `organigramm-vX.Y.Z` → Erweiterung bauen und packen → GitHub Release mit der ZIP (`make_latest: false`,
# siehe Vorlage). Der Tag-Filter `v*` der Musik-App greift hier nicht: `organigramm-v…` beginnt nicht mit `v`.
#
# Ablauf: erst in main mergen (CI grün) → `git tag organigramm-vX.Y.Z && git push origin organigramm-vX.Y.Z`.
on:
  push:
    tags:
      - 'organigramm-v*'

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/erweiterung-release.yml
    with:
      praefix: organigramm-
      workspace: organigramm
      kuerzel: organigramm
      titel: Organigramm
      anleitung: docs/betrieb/ORGANIGRAMM.md
